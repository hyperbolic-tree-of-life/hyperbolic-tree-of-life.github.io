    <body>    
        <style>
            .unitdisk-nav svg, .unitdisk-nav svg .mouse-circle-cursor {
                cursor: pointer;
            }
        </style>
        <script>
            const ua = navigator.userAgent
            const isMobile = window.matchMedia("only screen and (max-width: 760px)").matches
            const isValidBrowser = !/MSIE/i.test(ua) && !/Trident/i.test(ua) && !/Edge\/\d./i.test(ua)
            console.log(ua, isMobile, isValidBrowser)

            if (false)// isMobile || !isValidBrowser)
                document.body.innerHTML = '<p style="text-align:center; color:#fff;"><br><br>Sorry, your browser/device is not supported yet 😿 <br>Please use Chrome, Firefox or Safari,<br>on a device at least the size of a tablet.'
            else {                
                const script = document.createElement('script')
                script.src = 'hypertree-of-life.js'
                document.head.appendChild(script)
                document.body.onload = function() {
                    initMainPage()
                }                
            }

            const app = {
                text: null,
                hypertree: null,
                // the start view (2026-11-24, fitted to a screenshot: the root at the
                // bottom, Passeriformes at the top): a goto there, when the page opens
                // and from the home button
                startView: ()=> app.hypertree.api.goto({ re: .025, im: .755 }, .0525)
                    .then(()=> app.hypertree.drawDetailFrame()),
                search: null,
                lang: null
            }
            function initMainPage() {
                // ?lang= of a choice, else the system language (settings.ts)
                const l = htol.settings.language(htol.alllanguages)
                app.lang = l
                // Google Analytics only after consent (the cookie card, consent.ts)
                htol.consent.init(l)
                // the phone version (settings.ts: up to 760 px wide, ?phone=1): the tree
                // above, square, a little wider than the screen, the text below; fewer
                // nodes, fewer and larger labels (sized per script)
                const phone = htol.settings.phone()
                const captionHeight = .05

                this.controllerTree = new htol.Navigation2(
                    { parent: document.body },
                    {
                        title: "Hyperbolic Tree of Life",
                        language: l,
                        languages: htol.alllanguages,
                        // the root to the center; the search card over the tree
                        // home: a goto to the start view, as when the page opens (startView)
                        onHome:    ()=> app.hypertree && app.startView(),
                        onSearch:  ()=> app.search && app.search.toggle(),
                        onLangChange:  l=> {
                            console.log("lang change", l)
                            showText(l)
                            app.lang = l

                            // the names and which articles exist (the 𝐖) in the new language
                            const nl = htol.labels.langWithWikiLoader(l, htol.settings.wikipediaLanguage(l), t=> app.titles = t)
                            app.hypertree.api.setLangloader(()=> {
                                app.hypertree.unitdisk.layerStack.updateLayers()
                                app.hypertree.update.data()
                                htol.settings.sizeLabels(app.hypertree, l)
                            }, ()=>{}, nl)
                        }, 
                        content: p=> {
                            var d = document.createElement('div')
                            d.innerHTML = `
                                <div id='info'>               
                                    <div class="topic">Hyperbolic Tree of Life</div>
                                    <div id="text"></div>
                                </div>
                                <div id="maintree"></div>
                                <div class="footer">
                                    <svg viewBox='0 0 300 1' preserveAspectRatio='none'>
                                        <path d='M0,0 300,0' />
                                    </svg>
                                </div>`
                            p.appendChild(d)
                            app.text = d.querySelector('#text')
                            showText(l)
                            

                            const π = Math.PI
                            const iconmap = new htol.Icons()
                            const hasLazy =          n=> (n.hasOutChildren && n.isOutλ)
                            const isLeaf =           n=> !n.children || !n.children.length
                            const isRoot =           n=> !n.parent 
                            const hasCircle =        n=> hasLazy(n) || isRoot(n) || isLeaf(n)
                            const nodeInitR =        (c)=> (ud, d)=> c * ((d.children && d.parent) ? innerNodeScale(d) : 1)     
                            const nodeInitRNoInner = (c)=> (ud, d)=> c
                            const nodeScale =        d=> d.distScale * (hasLazy(d) ? .8 : 1)    
                            const nodeScaleNoInner = d=> d.distScale    
                            const innerNodeScale =   d=> d.precalc.weightScale
                            
                            const otolSetModel = new htol.OtolSetModel()
                            // Branch pages: the clades of the new data pipeline
                            // (docs/DATA-PIPELINE.md) listed in clades-16.1.json (written by
                            // npm run otol:convert: name -> tree file); without that file the
                            // old ones (OtolSetModel, <clade>.d3.json). The tree data waits for
                            // the list, so langInitBFS knows which nodes have a page.
                            let branchIndex = null
                            // the main page tree: the same tree with the felt importance of
                            // npm run otol:wikidata when the list names it (main), else as is
                            let mainTree = 'eukaryota'
                            const branchIndexLoaded = fetch('hierarchies/Open-Tree-of-Life/clades-16.1.json')
                                .then(r=> r.ok ? r.json() : null)
                                .then(j=> { branchIndex = j && j.clades; mainTree = (j && j.main) || mainTree })
                                .catch(()=> {})
                            const hasBranchPage = name=> branchIndex ? Boolean(name && branchIndex[name]) : otolSetModel.fileExists(name)
                            const branchFile = name=> branchIndex && branchIndex[name] ? branchIndex[name].file : name.toLowerCase()

                            // the loading card over the tree: the download, then building the tree
                            const treeElement = document.querySelector('#maintree')
                            const s = htol.strings(l)
                            const loading = new htol.LoadingOverlay(treeElement, 'Hyperbolic Tree of Life', l)
                            // three bars: the tree file, the names (language map, Wikipedia titles), building
                            const progress = new htol.LoadProgress(loading)

                            // the page's configuration (src/presets.ts: main page, phone version)
                            // and what only this page knows: the files, the labels, the click
                            app.hypertree = new htol.Hypertree(
                                { parent:document.querySelector('#maintree') },
                                htol.composeOverlays(htol.treeOfLife.page('main', { phone }), {
                                    dataloader: progress.loader(branchIndexLoaded.then(()=> `hierarchies/${mainTree}.d3.json`), 'tree'),
                                    // the names and which articles exist in the language (the 𝐖)
                                    langloader: htol.labels.langWithWikiLoader(l, htol.settings.wikipediaLanguage(l),
                                        t=> app.titles = t, url=> progress.loader(url, 'names')),
                                    dataInitBFS: (ht, n)=> {
                                        const id = n.data.name
                                        n.precalc.imageHref = iconmap.fileName2IconUrl(id, n.data.type)
                                        n.precalc.icon = iconmap.emojimap[id]    
                                        
                                        // the main page tree is balanced by hand (its file);
                                        // no layout.childOrder 'balanced' here
                                        if (n.children)
                                            if (n.height%2 === 0)
                                                n.children = n.children.reverse()
                                    },
                                    langInitBFS: (ht, n)=> {                
                                        const id = n.data && n.data.name
                                        // 𝐖 and the article title with an article in the language, else the name
                                        // in the language or the scientific name; unnamed nodes
                                        // nothing (labels.ts)
                                        const text = htol.labels.labelText(n, ht.langMap, app.titles)
                                        const l = text.startsWith('𝐖') ? text : ""
                                        if (!hasBranchPage(id)) {
                                            // no branch page: its label only while it is the node
                                            // under the mouse (labelOnHover). Like every node it
                                            // has its voronoi cell (clickable): a click on it is
                                            // passed on to the branch page of its nearest
                                            // ancestor (onNodeClick)
                                            n.precalc.wiki = ""
                                            n.precalc.label = text
                                            n.precalc.labelOnHover = true
                                            n.precalc.clickable = true
                                        }
                                        else {
                                            // a branch page: on the desktop its label only under
                                            // the mouse too; on a phone, where nothing can be
                                            // hovered, always (presets.ts phone: maxLabels high
                                            // enough for every branch)
                                            n.precalc.wiki = l
                                            n.precalc.label = text
                                            n.precalc.clickable = true
                                            // (more than 5 siblings: no permanent label, labels.ts manySiblings)
                                            n.precalc.labelOnHover = !phone || htol.labels.manySiblings(n)
                                            n.precalc.branchPage = true
                                        }
                                    },
                                    interaction: {
                                        onNodeClick: (n, m, l)=> {
                                            // the node itself or its nearest ancestor with a branch page
                                            const page = n && n.ancestors().find(a=> hasBranchPage(a.data.name))
                                            if (page)
                                                window.location.href = htol.settings.withChoices(`/otol.html?c=${branchFile(page.data.name)}`)
                                        }
                                    }
                                })
                            )
                            // the search: the node's own (scientific) name and its name in
                            // the language in use
                            app.search = new htol.SearchOverlay({
                                tree:   treeElement,
                                lang:   ()=> app.lang,
                                nodes:  ()=> app.hypertree.data ? app.hypertree.data.descendants() : [],
                                names:  n=> [n.data.name, app.hypertree.langMap && app.hypertree.langMap[n.data.name]],
                                icon:   n=> n.precalc.icon,
                                choose: n=> htol.gotoNode(app.hypertree, n),
                            })
                            app.hypertree.initPromise.then(()=> loading.done(), ()=> loading.failed(s.failed))
                            app.hypertree.initPromise
                                .then(()=> new Promise((ok, err)=> app.hypertree.animateUp(ok, err)))
                                // start view (2026-11-24, fitted to a screenshot: the root at
                                // the bottom, Passeriformes at the top); P and λ together, a
                                // gotoλ after goto would move the view again
                                .then(()=> app.startView())
                            // the labels in screen pixels for the language, as large as on
                            // the branch pages (settings.sizeLabels; again after a language
                            // switch and when the size changes)
                            app.hypertree.initPromise.then(()=> htol.settings.sizeLabels(app.hypertree, app.lang))
                            window.addEventListener('resize', ()=> htol.settings.sizeLabels(app.hypertree, app.lang))
                        }
                    }            
                )
            }
/*
        
*/
