<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
    <head>
        <title>Hyperbolic tree</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <link rel="icon"       href="img/avatar-light.png"/>
        <link rel="stylesheet" href="hypertree-of-life-light.css" id="ldswitch">      

        <script src="hypertree-of-life.js"></script>

    <body>
        <script>
            const c = new URLSearchParams(document.location.search.substring(1)).get('c')
            // view=rect: the rectangular view (half-plane, d3-hypertree geometry.view 'halfplane')
            const view = new URLSearchParams(document.location.search.substring(1)).get('view') === 'rect' ? 'rect' : 'disk'
            // order of the children: 'balanced' (d3-hypertree layout.childOrder: the heaviest
            // child in the middle, the heaviest path runs straight), order=data: the old rule
            // (reversed on every second level)
            const childOrder = new URLSearchParams(document.location.search.substring(1)).get('order') === 'data' ? 'data' : 'balanced'
            // ?lang= of a choice, else the system language (settings.ts)
            const l = htol.settings.language(htol.alllanguages)
            // the phone version (settings.ts: up to 760 px wide, ?phone=1): the tree above,
            // square, a little wider than the screen, the Wikipedia panel below; fewer
            // nodes, fewer and larger labels (sized per script, settings.sizeLabels)
            const phone = htol.settings.phone()
            const captionHeight = .05
            // The Wikipedia panel: the article of the node next to the center, in the language
            // in use, only if that Wikipedia has one (langmaps/<lang>.wiki.json from
            // npm run otol:wikidata: scientific name -> article title); otherwise the page
            // shown stays. Without that file (older data) the scientific name is the title.
            const wiki = {
                lang:   l,                 // changes with the language switch
                titles: undefined,         // undefined: loading, null: no file, else the map
                shown:  null,              // { lang, title } in the panel
                pending: null,             // the node name waiting for the titles
                // the language changes: the titles come with its names (langloader)
                expect(lang) { this.lang = lang; this.titles = undefined },
                // the titles of a language (from the langloader, labels.ts), and the
                // article waiting for them
                setTitles(lang, t) {
                    if (this.lang !== lang) return
                    this.titles = t
                    if (this.pending) { const p = this.pending; this.pending = null; this.show(p) }
                },
                // the language loader of the tree: the names and which articles exist (the
                // 𝐖 of the labels); the Wikipedia panel uses the same titles
                loader(lang, load) {
                    this.expect(lang)
                    return htol.labels.langWithWikiLoader(lang, htol.settings.wikipediaLanguage(lang), t=> this.setTitles(lang, t), load)
                },
                title(name) { return this.titles === null ? name : this.titles[name] },
                show(name) {
                    if (!name || !app.focusview) return
                    if (this.titles === undefined) { this.pending = name; return }
                    const t = this.title(name)
                    if (!t) return                                  // no article in this language
                    this.open(this.lang, t)
                },
                open(lang, title) {
                    this.shown = { lang, title }
                    const src = htol.settings.wikipediaUrl(lang, title)
                    if (src !== app.focusview.ui.src) app.focusview.ui.src = src
                },
            }

            function createHypertree(p, file) {
                const π = Math.PI
                const iconmap = new htol.Icons()
                const hasLazy =          n=> (n.hasOutChildren && n.isOutλ)
                const isLeaf =           n=> !n.children || !n.children.length
                const isRoot =           n=> !n.parent 
                const hasCircle =        n=> hasLazy(n) || isRoot(n) || isLeaf(n)
                const nodeInitR =        (c)=> (ud, d)=> c * ((d.children && d.parent) ? innerNodeScale(d) : 1)     
                const nodeInitRNoInner = (c)=> (ud, d)=> c
                const nodeScale =        d=> d.distScale * (hasLazy(d) ? .8 : 1)    
                const nodeScaleNoInner = d=> d.distScale    
                const innerNodeScale =   d=> d.precalc.weightScale

                // the loading card over the tree: the download, then building the tree
                const s = htol.strings(l)
                const title = c.replace(/-[\d.]+$/, '').replace(/^./, x=> x.toUpperCase())
                const loading = new htol.LoadingOverlay(p, title, l)
                // three bars: the tree file, the names (language map, Wikipedia titles), building
                const progress = new htol.LoadProgress(loading)

                // the page's configuration (src/presets.ts: branch page, phone version)
                // and what only this page knows: the files, the labels, the callbacks
                const htree = new htol.Hypertree(
                    { parent:p },
                    htol.composeOverlays(htol.treeOfLife.page('branch', { phone, view, childOrder }), {
                        dataloader: progress.loader(`hierarchies/Open-Tree-of-Life/${c}.d3.json`, 'tree'),
                        langloader: wiki.loader(l, url=> progress.loader(url, 'names')),
                        dataInitBFS: (ht, n)=> {
                            const id = n.data.name
                            n.precalc.imageHref = iconmap.fileName2IconUrl(id, n.data.type)
                            n.precalc.icon = iconmap.emojimap[id]

                            if (childOrder === 'data' && n.children && n.height%2 === 0)
                                n.children = n.children.reverse()
                        },
                        langInitBFS: (ht, n)=> {
                            // 𝐖 and the article's title with an article in the language, else
                            // the name in the language or the scientific name; unnamed nodes
                            // nothing (labels.ts)
                            const text = htol.labels.labelText(n, ht.langMap, wiki.titles)
                            n.precalc.wiki = text.startsWith('𝐖') ? text : ""
                            n.precalc.label = text
                            // every node has its voronoi cell (the click goes there), also
                            // the unnamed ones
                            n.precalc.clickable = true
                        },
                        interaction: {
                            onCenterNodeChange: (n, s)=> {
                                app.navigation.view.ui.breadcrumb2.innerText = s
                                const a = n.data.name
                                if (a) {
                                    app.currentNode = a
                                    // its article, if there is one in this language
                                    wiki.show(a)
                                }
                            },
                            onNodeClick: (n, m, l)=> {
                                htree.api.goto({ re:-n.layout.z.re, im:-n.layout.z.im }, null)
                                    .then(()=> l.view.hypertree.drawDetailFrame())
                            }
                        }
                    })
                )
                htree.initPromise.then(()=> loading.done(), ()=> loading.failed(s.failed))
                // the search: the node's own (scientific) name and its name in the language in use
                app.search = new htol.SearchOverlay({
                    tree:   p,
                    lang:   ()=> app.lang,
                    nodes:  ()=> htree.data ? htree.data.descendants() : [],
                    names:  n=> [n.data.name, htree.langMap && htree.langMap[n.data.name]],
                    icon:   n=> n.precalc.icon,
                    choose: n=> htol.gotoNode(htree, n),
                })
                // start view: the hand-set one of an old tree file (htol.initpromise[c]);
                // otherwise (the files of the data pipeline, <clade>-16.1) computed: the
                // root at the bottom, the main branchings in the middle, the branches
                // filling the disk (d3-hypertree api.overview); zoomed up, then moved there
                const init = htol.initpromise[c]
                if (init) init(htree.initPromise, htree)
                else htree.initPromise
                    .then(()=> {
                        const v = htree.api.overview()
                        htree.args.geometry.transformation.state.λ = v.λ
                        return new Promise((ok, err)=> htree.animateUp(ok, err)).then(()=> htree.api.goto(v.P, null))
                    })
                    .then(()=> htree.drawDetailFrame())
                // the labels in screen pixels for the language, as large as the main
                // page's (settings.sizeLabels; again after a language switch and when the
                // size changes)
                htree.initPromise.then(()=> htol.settings.sizeLabels(htree, app.lang))
                window.addEventListener('resize', ()=> htol.settings.sizeLabels(htree, app.lang))
                return htree
            }
            
            const app = {
                root: document.querySelector('body'),
                navigation: null,
                splitter: null,
                hypertree: null,
                focusview: null,
                search: null,
                currentNode: null,
                lang: l
            }

            app.navigation = new htol.Navigation2(                 
                { parent: app.root }, 
                {
                    languages: htol.alllanguages,
                    // the root to the center; the search card over the tree
                    onHome:    ()=> app.hypertree && app.hypertree.api.gotoHome().then(()=> app.hypertree.drawDetailFrame()),
                    onSearch:  ()=> app.search && app.search.toggle(),
                    // the view button: reload with the other view (the tree measures its
                    // element when it is built)
                    view:          view,
                    onViewChange:  v=> {
                        const u = new URL(document.location.href)
                        if (v === 'rect') u.searchParams.set('view', 'rect'); else u.searchParams.delete('view')
                        document.location.href = u.toString()
                    },
                    onLangChange:  l=> {
                        console.log("lang change", l)                        
                        // the names and which articles exist in the new language; then
                        // its article, if there is one (else the page shown stays)
                        const nl = wiki.loader(l)
                        app.lang = l
                        app.hypertree.api.setLangloader(()=> {
                            wiki.show(app.currentNode)
                            app.hypertree.unitdisk.layerStack.updateLayers()
                            app.hypertree.update.data()
                            htol.settings.sizeLabels(app.hypertree, l)
                        }, ()=>{}, nl)
                    },
                    path:      [
                        { label:'mgl', href:'' },
                        { label:'Hyperbolic Map', href:'/' },
                        { label:'Open Tree of Life', href:'https://tree.opentreeoflife.org', target:'_blank' },
                        { label: c, href:`/otol.html?c=${c}` }
                    ],                    
                    subpath: ["Welcome"],
                    content: (p)=> {
                        app.splitter = new htol.Splitter({
                            parent: p,
                            splitterProportion: 68,
                            // phone: the tree above (square), the Wikipedia panel below
                            direction: phone ? 'vertical' : 'horizontal'
                        })
                        app.hypertree = createHypertree(app.splitter.ui.left)
                        app.focusview = new htol.WikiUi({
                            parent: app.splitter.ui.right,
                            visible: false
                        })
                        // light/dark switched (by the user or the system): the article
                        // again, in Wikipedia's day or night mode
                        htol.settings.onThemeChange(()=> {
                            if (wiki.shown) wiki.open(wiki.shown.lang, wiki.shown.title)
                        })
                        return app.splitter
                    }
                }
            )
        </script>        
    </body>
</html>
